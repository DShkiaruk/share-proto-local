<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>{{PROTO_TITLE}} — protected prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0a0a;
      --primary: #171717;
      --primary-fg: #fafafa;
      --muted-fg: #737373;
      --muted: #f5f5f5;
      --border: #e5e5e5;
      --danger: #dc2626;
      --ring: #3b82f680;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Geist, system-ui, sans-serif;
      color: var(--ink);
      background: #fff;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 360px;
      padding: 24px;
    }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--muted);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 22px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted-fg);
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .pw-label {
      margin-top: 16px;
    }
    form.error input.bad {
      border-color: var(--danger);
    }
    .error-msg {
      display: none;
      font-size: 13px;
      line-height: 1.45;
      color: var(--danger);
      margin-top: 8px;
    }
    form.error .error-msg { display: block; }
    button {
      width: 100%;
      height: 40px;
      margin-top: 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary-fg);
      background: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms;
    }
    button:hover { background: #2e2e2e; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button[disabled] { opacity: 0.6; cursor: default; }
    .foot {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted-fg);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #fafafa;
        --primary: #fafafa;
        --primary-fg: #171717;
        --muted-fg: #a1a1a1;
        --muted: rgb(255 255 255 / 0.08);
        --border: rgb(255 255 255 / 0.14);
      }
      body { background: #161616; }
      input[type="password"], input[type="text"] { background: transparent; }
      button:hover { background: #e5e5e5; }
      .mark { background: rgb(255 255 255 / 0.08); }
    }
    @media (pointer: coarse) {
      /* 16px stops iOS Safari from auto-zooming the focused input */
      input[type="password"], input[type="text"] { font-size: 16px; height: 44px; }
      button { height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🔒</div>
    <h1>{{PROTO_TITLE}}</h1>
    <p class="sub">This prototype is password-protected. Enter your name and the password you received — comments you leave will be signed with your name.</p>
    <form id="form" novalidate>
      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="name" maxlength="40" autofocus required />
      <label for="password" class="pw-label">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <p class="error-msg" id="error">That password didn’t work. Check with the person who shared this link.</p>
      <button type="submit" id="submit">Continue</button>
    </form>
    <p class="foot">Shared for review.</p>
  </main>
  <script>
    const form = document.getElementById('form');
    const nameInput = document.getElementById('name');
    const passInput = document.getElementById('password');
    const submit = document.getElementById('submit');
    const errorMsg = document.getElementById('error');

    function fail(text, badInput) {
      errorMsg.textContent = text;
      form.classList.add('error');
      document.querySelectorAll('input').forEach((i) => i.classList.remove('bad'));
      badInput.classList.add('bad');
      badInput.focus();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      form.classList.remove('error');
      const name = nameInput.value.trim();
      const password = passInput.value.trim();
      if (!name) { fail('Please enter your name — it will sign your comments.', nameInput); return; }
      if (!password) { fail('Please enter the password you received.', passInput); return; }
      submit.disabled = true;
      submit.textContent = 'Checking…';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password }),
        });
        if (r.ok) {
          // Keep query params — deep links like /?comment=<id> must survive login.
          location.reload();
          return;
        }
        fail('That password didn’t work. Check with the person who shared this link.', passInput);
        passInput.select();
      } catch {
        fail('Network error — try again.', passInput);
      } finally {
        submit.disabled = false;
        submit.textContent = 'Continue';
      }
    });
  </script>
</body>
</html>
